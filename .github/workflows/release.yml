name: Build and publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version matching the plugin header, e.g. 1.0.3'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: notice-manager-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP
        run: |
          find . -name '*.php' -not -path './build/*' -print0 | xargs -0 -n1 php -l
          php tests/schedule.php
          php tests/updater.php
          php tests/preview.php
          node --check assets/js/frontend.js
      - name: Build ZIP and metadata
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          python3 tools/build_release.py "$VERSION"
          echo "RELEASE_VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Upload and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v$RELEASE_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'A release already exists. Refusing to overwrite published packages.' >&2
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "WP Notice Manager $RELEASE_VERSION" --notes-file CHANGELOG.md
          gh release upload "$TAG" "build/wp-notice-manager-$RELEASE_VERSION.zip" build/update.json
          gh release edit "$TAG" --draft=false --latest
